# At most 30 requests per minute per IP
limit_req_zone $binary_remote_addr zone=schedule:1m rate=30r/m;
limit_req_status 429;
log_format schedule '$remote_addr [$time_local] :$server_port "$request" $status $body_bytes_sent "$http_user_agent"';

upstream schedule_app {
    server 127.0.0.1:8090;
    keepalive 4;
}

# Legacy links already added to people's calendars. They only serve /schedule.ics
server {
    listen 8000;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/schedule.log schedule;

    location = /schedule.ics {
        limit_except GET { deny all; }
        limit_req zone=schedule burst=20 nodelay;
        proxy_pass http://schedule_app/schedule.ics?group=%D0%9A0609-24&alarm=0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location / { return 404; }
}

server {
    listen 8001;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/schedule.log schedule;

    location = /schedule.ics {
        limit_except GET { deny all; }
        limit_req zone=schedule burst=20 nodelay;
        proxy_pass http://schedule_app/schedule.ics?group=%D0%9A0409-25/1&alarm=0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location / { return 404; }
}

# New endpoint: https://funkov.space:8443/schedule.ics?group=К0609-24
server {
    listen 8443 ssl http2;
    server_name funkov.space;
    server_tokens off;
    access_log /var/log/nginx/schedule.log schedule;

    ssl_certificate     /etc/letsencrypt/live/funkov.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/funkov.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:schedule_ssl:1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Plain http:// on the HTTPS port: redirect to https:// instead of returning 400
    error_page 497 =301 https://$host:8443$request_uri;

    location = /schedule.ics {
        limit_except GET { deny all; }
        limit_req zone=schedule burst=20 nodelay;
        # The query string may contain raw Cyrillic; the app decodes it
        set $no_args "";
        proxy_set_header X-Query $args;
        proxy_pass http://schedule_app/schedule.ics$no_args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location / { return 404; }
}
